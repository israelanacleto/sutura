<div class="shell">
  <aside class="nav">
    <div class="marca">
      <!-- A inicial desenhada como uma incisão costurada: o S é a linha, os traços
           que a atravessam são os pontos. Mesma marca do favicon. -->
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="16" fill="#0f766e" />
        <path
          d="M21.3 10.6 C21.3 7.4, 10.7 7.4, 10.7 12.1 C10.7 16.6, 21.3 15.4, 21.3 19.9 C21.3 24.6, 10.7 24.6, 10.7 21.4"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.1"
          stroke-linecap="round"
        />
        <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none">
          <path d="M17.93 10.14 L18.41 6.78" />
          <path d="M12.81 11.21 L10.47 8.74" />
          <path d="M13.43 13.24 L11.83 16.24" />
          <path d="M20.17 15.76 L18.57 18.76" />
          <path d="M21.53 23.26 L19.19 20.79" />
          <path d="M13.59 25.22 L14.07 21.86" />
        </g>
      </svg>
      <div>
        <div class="marca-nome">Sutura</div>
        <div class="marca-sub">camada de integração</div>
      </div>
    </div>

    <nav>
      <a routerLink="/conexoes" routerLinkActive="ativo">
        <span class="rotulo">Conexões</span>
        <span class="contador">{{ store.conectados() }}/{{ store.conexoes().length }}</span>
      </a>
      <a routerLink="/identificacao" routerLinkActive="ativo">
        <span class="rotulo">Identificação</span>
        @if (store.pendentes() > 0) {
          <span class="contador alerta">{{ store.pendentes() }}</span>
        }
      </a>
      <a routerLink="/paciente" routerLinkActive="ativo">
        <span class="rotulo">Histórico unificado</span>
      </a>
    </nav>

    <div class="nav-rodape">
      <div class="org">
        <div class="eyebrow">Instância</div>
        <div>Grupo Santa Clara</div>
      </div>
      <button type="button" class="reiniciar" (click)="store.limparSessao()">
        Atualizar dados
      </button>
      <div class="aviso">Dados fictícios · Oracle ADB</div>
    </div>
  </aside>

  <main class="conteudo">
    <router-outlet />
  </main>
</div>
